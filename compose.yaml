# Local-only proof of concept. No ports are exposed beyond the local computer.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5678:5678'
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: 'false' # localhost-only demo: never use for internet-facing deployments
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      GENERIC_TIMEZONE: Africa/Lagos
      TZ: Africa/Lagos
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/demo-workflows:ro
    networks:
      - private_desk
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    environment:
      OLLAMA_NO_CLOUD: '1'
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - private_desk

  dashboard:
    build: ./app
    restart: unless-stopped
    ports:
      - '127.0.0.1:3105:3105'
    environment:
      PORT: '3105'
      BIND_HOST: 0.0.0.0
      DEMO_MODE: ${DEMO_MODE:-simulation}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/rare-space-private-desk
    networks:
      - private_desk
    depends_on:
      - n8n

networks:
  private_desk:
    driver: bridge

volumes:
  n8n_data:
  ollama_data:
